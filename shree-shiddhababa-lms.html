<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shree Shiddhababa Secondary School — Panityanki, Sindhuli</title>
<link rel="icon" id="faviconLink" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7A1F3D;
    --maroon-dark:#54142B;
    --maroon-soft:#974A64;
    --gold:#C9971F;
    --gold-light:#E9CE86;
    --cream:#FBF6EC;
    --cream-deep:#F1E7D3;
    --ink:#2A2420;
    --ink-soft:#6B5F53;
    --sage:#4F6B4A;
    --danger:#A3352E;
    --white:#FFFFFF;
    --line:#E3D6BE;
    --shadow: 0 8px 24px rgba(84,20,43,0.12);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Mukta',sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Yatra One',cursive;
    font-weight:400;
    letter-spacing:.3px;
    color:var(--maroon-dark);
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:'Mukta',sans-serif;cursor:pointer;}
  img{max-width:100%;display:block;}
  ::selection{background:var(--gold-light);}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

  /* ---------- pagoda motif ---------- */
  .pagoda{display:block;}
  .divider-pagoda{display:flex;justify-content:center;margin:6px 0 28px;opacity:.85;}

  /* ---------- layout shells ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
  .site-header{
    position:sticky;top:0;z-index:40;
    background:var(--cream);
    border-bottom:1px solid var(--line);
  }
  .header-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:1120px;margin:0 auto;gap:16px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-text .en{font-family:'Yatra One',cursive;font-size:20px;color:var(--maroon-dark);line-height:1.1;}
  .brand-text .np{font-size:13px;color:var(--ink-soft);}
  nav.main-nav{display:flex;gap:4px;flex-wrap:wrap;}
  nav.main-nav a{padding:8px 12px;border-radius:2px;font-weight:600;font-size:14.5px;color:var(--ink-soft);border-bottom:2px solid transparent;transition:.15s;}
  nav.main-nav a:hover, nav.main-nav a.active{color:var(--maroon-dark);border-color:var(--gold);}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 18px;border:1.5px solid var(--maroon-dark);
    background:var(--maroon-dark);color:var(--cream);
    font-weight:700;font-size:14px;border-radius:2px;
    transition:.15s;
  }
  .btn:hover{background:var(--maroon);}
  .btn.ghost{background:transparent;color:var(--maroon-dark);}
  .btn.ghost:hover{background:var(--cream-deep);}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:var(--maroon-dark);}
  .btn.gold:hover{background:var(--gold-light);}
  .btn.danger{background:var(--danger);border-color:var(--danger);}
  .btn.small{padding:6px 12px;font-size:12.5px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  header.mobile-toggle{display:none;}

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    background-image:var(--hero-photo);
    background-size:cover;
    background-position:center;
    color:var(--cream);
    overflow:hidden;
  }
  .hero-inner{max-width:1120px;margin:0 auto;padding:64px 24px 84px;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;position:relative;z-index:2;}
  .hero .eyebrow{font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold-light);font-weight:700;margin-bottom:14px;text-shadow:0 2px 8px rgba(0,0,0,.55);}
  .hero h1{font-size:44px;line-height:1.15;color:var(--white);margin:0 0 6px;text-shadow:0 2px 10px rgba(0,0,0,.55);}
  .hero .np-name{font-size:19px;color:var(--gold-light);margin:0 0 18px;text-shadow:0 2px 8px rgba(0,0,0,.55);}
  .hero p.lead{font-size:16.5px;color:#EFE2E9;max-width:520px;line-height:1.65;margin:0 0 26px;text-shadow:0 1px 6px rgba(0,0,0,.5);}
  .hero .cta-row{display:flex;gap:12px;flex-wrap:wrap;}
  .hero-arch{
    position:relative;
    background:var(--cream);
    border-radius:150px 150px 6px 6px;
    padding:34px 26px 26px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .hero-arch svg{margin:0 auto 12px;}
  .hero-arch .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;}
  .hero-arch .stat{padding:10px 4px;border-top:1px solid var(--line);}
  .hero-arch .stat b{display:block;font-family:'Yatra One',cursive;font-size:26px;color:var(--maroon-dark);}
  .hero-arch .stat span{font-size:12px;color:var(--ink-soft);}
  .hero-bg-tiers{position:absolute;inset:0;opacity:.12;z-index:1;}

  section{padding:64px 0;}
  section.tight{padding:40px 0;}
  .section-head{text-align:center;max-width:640px;margin:0 auto 8px;}
  .section-head .eyebrow{font-size:12.5px;letter-spacing:2px;text-transform:uppercase;color:var(--maroon);font-weight:700;}
  .section-head h2{font-size:32px;margin:6px 0 0;}
  .section-head p{color:var(--ink-soft);margin-top:10px;line-height:1.6;}

  .grid{display:grid;gap:22px;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}

  .card{
    background:var(--white);border:1px solid var(--line);border-radius:3px;
    padding:24px;position:relative;
  }
  .card .arch-tab{
    position:absolute;top:-14px;left:22px;width:34px;height:20px;
    background:var(--gold);border-radius:16px 16px 0 0;
  }
  .card h3{font-size:19px;margin:6px 0 8px;}
  .card p{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0;}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--maroon);background:var(--cream-deep);padding:3px 9px;border-radius:2px;margin-bottom:10px;}
  .date-chip{font-size:12.5px;color:var(--ink-soft);font-weight:600;}

  .feature{display:flex;gap:14px;align-items:flex-start;}
  .feature .num{font-family:'Yatra One',cursive;font-size:22px;color:var(--gold);min-width:34px;}

  footer.site-footer{margin-top:auto;background:var(--maroon-dark);color:#EAD9DF;padding:48px 0 24px;}
  footer.site-footer .wrap{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:36px;}
  footer.site-footer h4{color:var(--gold-light);font-family:'Yatra One',cursive;font-weight:400;font-size:18px;margin:0 0 12px;}
  footer.site-footer p, footer.site-footer li{font-size:14px;line-height:1.8;color:#DEC7CE;}
  footer.site-footer ul{list-style:none;padding:0;margin:0;}
  footer .bottom-bar{border-top:1px solid rgba(255,255,255,.12);margin-top:32px;padding-top:16px;text-align:center;font-size:12.5px;color:#C4A1AC;}

  .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .gallery-grid .g-item{aspect-ratio:1/1;overflow:hidden;border-radius:3px;border:1px solid var(--line);background:var(--cream-deep);position:relative;}
  .gallery-grid .g-item img{width:100%;height:100%;object-fit:cover;}
  .gallery-grid .g-item figcaption{position:absolute;bottom:0;left:0;right:0;background:rgba(42,36,32,.72);color:#fff;font-size:12px;padding:6px 8px;}

  .empty-state{border:2px dashed var(--line);border-radius:4px;padding:36px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state b{display:block;color:var(--maroon-dark);font-family:'Yatra One',cursive;font-size:18px;margin-bottom:4px;}

  .map-embed{width:100%;height:280px;border:1px solid var(--line);border-radius:3px;filter:sepia(8%);}

  /* ---------- admin shell ---------- */
  .admin-shell{display:flex;min-height:100vh;background:var(--cream-deep);}
  .admin-sidebar{width:230px;background:var(--maroon-dark);color:#EAD9DF;flex-shrink:0;display:flex;flex-direction:column;}
  .admin-sidebar .brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.12);}
  .admin-sidebar .brand .en{color:#fff;}
  .admin-sidebar .brand .np{color:#D9B7C1;}
  .admin-nav{padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
  .admin-nav button{
    text-align:left;background:transparent;border:none;color:#E7D3DA;
    padding:10px 12px;border-radius:3px;font-size:14.5px;font-weight:600;
    display:flex;align-items:center;gap:10px;
  }
  .admin-nav button:hover{background:rgba(255,255,255,.08);}
  .admin-nav button.active{background:var(--gold);color:var(--maroon-dark);}
  .admin-sidebar .foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);}
  .admin-main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .admin-topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;}
  .admin-content{padding:28px;flex:1;overflow-x:auto;}
  .admin-content h2{margin:0 0 4px;font-size:26px;}
  .admin-content .sub{color:var(--ink-soft);font-size:14px;margin-bottom:22px;}

  .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:26px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:3px;padding:18px;border-left:4px solid var(--gold);}
  .stat-card b{display:block;font-family:'Yatra One',cursive;font-size:28px;color:var(--maroon-dark);}
  .stat-card span{font-size:13px;color:var(--ink-soft);}

  table.data-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);font-size:14px;}
  table.data-table th{background:var(--cream-deep);text-align:left;padding:10px 12px;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--maroon-dark);border-bottom:1px solid var(--line);}
  table.data-table td{padding:10px 12px;border-bottom:1px solid #F0E9DC;vertical-align:middle;}
  table.data-table tr:hover td{background:#FCF9F2;}
  .row-actions{display:flex;gap:6px;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar .filters{display:flex;gap:8px;flex-wrap:wrap;}

  select, input[type=text], input[type=number], input[type=date], input[type=password], input[type=tel], input[type=email], textarea{
    font-family:'Mukta',sans-serif;padding:9px 11px;border:1px solid var(--line);border-radius:3px;font-size:14px;background:#fff;color:var(--ink);width:100%;
  }
  textarea{resize:vertical;min-height:80px;}
  label{font-size:12.5px;font-weight:700;color:var(--maroon-dark);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field-row.cols-3{grid-template-columns:1fr 1fr 1fr;}

  .modal-overlay{position:fixed;inset:0;background:rgba(42,36,32,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:4px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;box-shadow:var(--shadow);}
  .modal h3{margin:0 0 18px;font-size:21px;}
  .modal .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;letter-spacing:.3px;}
  .badge.ok{background:#E4EEDF;color:var(--sage);}
  .badge.warn{background:#FBE9C6;color:#8A5D00;}
  .badge.bad{background:#F5DEDB;color:var(--danger);}

  .att-grid{display:flex;flex-direction:column;gap:6px;}
  .att-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:3px;}
  .att-options{display:flex;gap:6px;}
  .att-options button{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:3px;font-size:12.5px;font-weight:700;}
  .att-options button.p.sel{background:var(--sage);color:#fff;border-color:var(--sage);}
  .att-options button.a.sel{background:var(--danger);color:#fff;border-color:var(--danger);}
  .att-options button.l.sel{background:var(--gold);color:var(--maroon-dark);border-color:var(--gold);}

  .login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--maroon-dark), var(--maroon));padding:20px;}
  .login-card{background:var(--cream);border-radius:150px 150px 8px 8px;padding:44px 34px 34px;width:100%;max-width:380px;text-align:center;box-shadow:var(--shadow);}
  .login-card h2{margin:14px 0 4px;}
  .login-card p.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 22px;}
  .login-card form{text-align:left;}
  .login-error{color:var(--danger);font-size:13px;margin-top:10px;text-align:left;display:none;}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--maroon-dark);color:#fff;padding:12px 20px;border-radius:3px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:200;opacity:0;transform:translateY(8px);transition:.25s;}
  .toast.show{opacity:1;transform:translateY(0);}

  .print-sheet{display:none;}
  @media print{
    body *{visibility:hidden;}
    .print-sheet, .print-sheet *{visibility:visible;}
    .print-sheet{display:block;position:fixed;top:0;left:0;width:100%;padding:30px;}
  }

  @media (max-width:960px){
    .hero-inner{grid-template-columns:1fr;}
    footer.site-footer .wrap{grid-template-columns:1fr;}
    .grid.cols-3, .grid.cols-4{grid-template-columns:1fr 1fr;}
    .stat-cards{grid-template-columns:1fr 1fr;}
    .admin-shell{flex-direction:column;}
    .admin-sidebar{width:100%;flex-direction:row;overflow-x:auto;}
    .admin-nav{flex-direction:row;}
    .field-row, .field-row.cols-3{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    nav.main-nav{display:none;}
    .gallery-grid{grid-template-columns:1fr 1fr;}
    .grid.cols-3, .grid.cols-4{grid-template-columns:1fr;}
  }
</style>
</head>

<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="printSheet" class="print-sheet"></div>

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){ /* not found or error -> fall through to defaults */ }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
async function saveData(){
  try{
    const res = await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), false);
    if(!res) showToast('Could not save — please try again');
    else showToast('Saved');
  }catch(e){
    showToast('Storage error — changes may not persist');
  }
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return ''; const dt = new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- pagoda motif svg ---------------- */
function pagodaSvg(color1, color2, size){
  color1 = color1 || 'var(--maroon-dark)'; color2 = color2 || 'var(--gold)';
  size = size || 64;
  return `<svg class="pagoda" width="${size}" height="${size*0.85}" viewBox="0 0 100 86" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 4 L58 16 H42 Z" fill="${color2}"/>
    <rect x="47" y="4" width="6" height="10" fill="${color2}"/>
    <path d="M28 24 H72 L64 16 H36 Z" fill="${color1}"/>
    <rect x="34" y="24" width="32" height="6" fill="${color1}"/>
    <path d="M16 42 H84 L70 30 H30 Z" fill="${color1}"/>
    <rect x="22" y="42" width="56" height="6" fill="${color1}"/>
    <path d="M6 62 H94 L78 48 H22 Z" fill="${color1}"/>
    <rect x="14" y="62" width="72" height="6" fill="${color1}"/>
    <rect x="30" y="68" width="10" height="16" fill="${color1}"/>
    <rect x="60" y="68" width="10" height="16" fill="${color1}"/>
    <rect x="44" y="68" width="12" height="16" fill="${color2}"/>
  </svg>`;
}
function pagodaDivider(){
  return `<div class="divider-pagoda">${pagodaSvg('var(--maroon)','var(--gold)',40)}</div>`;
}

async function boot(){
  document.documentElement.style.setProperty('--hero-photo', `url("${HERO_BG}")`);
  document.getElementById('faviconLink').setAttribute('href', LOGO_IMG);
  DATA = await loadData();
  render();
}
function render(){
  const app = document.getElementById('app');
  if(VIEW === 'login'){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  if(VIEW === 'admin' && IS_ADMIN){ app.innerHTML = renderAdmin(); attachAdminEvents(); return; }
  app.innerHTML = renderPublic();
  attachPublicEvents();
}

function attachPublicEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.preventDefault();
      const target = el.getAttribute('data-nav');
      if(target==='admissions') return;
      PUBLIC_PAGE = target;
      window.scrollTo(0,0);
      render();
    });
  });
  document.querySelectorAll('[data-action="go-login"]').forEach(el=>el.addEventListener('click', e=>{ e.preventDefault(); VIEW='login'; render(); }));
  document.querySelectorAll('[data-action="go-contact"]').forEach(el=>el.addEventListener('click', e=>{ e.preventDefault(); PUBLIC_PAGE='contact'; render(); }));
}

function attachLoginEvents(){
  document.getElementById('loginForm').addEventListener('submit', e=>{

    }else{
      document.getElementById('loginError').style.display='block';
    }
  });
  document.getElementById('backToSite').addEventListener('click', e=>{ e.preventDefault(); VIEW='public'; render(); });
}

function renderOverview(){
  const total = DATA.students.length;
  const male = DATA.students.filter(s=>s.gender==='Male').length;
  const female = DATA.students.filter(s=>s.gender==='Female').length;
  let totalDue = 0;
  Object.values(DATA.fees).forEach(list=>list.forEach(f=>{ totalDue += Math.max(0,(Number(f.amount)||0)-(Number(f.paid)||0)); }));
  const upcoming = DATA.events.filter(e=>e.date >= new Date().toISOString().slice(0,10)).length;

/* ---------- Grades ---------- */
function computeGrade(pct){
  if(pct>=90) return 'A+'; if(pct>=80) return 'A'; if(pct>=70) return 'B+'; if(pct>=60) return 'B';
  if(pct>=50) return 'C+'; if(pct>=40) return 'C'; if(pct>=35) return 'D'; return 'NG';
}
function renderGradesTab(){
  const opts = DATA.students.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const selId = editingId && DATA.students.find(s=>s.id===editingId) ? editingId : (opts[0] ? opts[0].id : '');
  const student = DATA.students.find(s=>s.id===selId);
  const records = (student && DATA.grades[selId]) || [];
  return `
  <div class="toolbar">
    <div class="filters">
      <select id="gradeStudentSel">
        ${opts.length ? opts.map(s=>`<option value="${s.id}" ${s.id===selId?'selected':''}>${esc(s.name)} (Class ${s.cls})</option>`).join('') : '<option>No students yet</option>'}
      </select>
    </div>
    <button class="btn" id="addExamBtn" ${student?'':'disabled'}>+ Add Exam Result</button>
  </div>
  ${!student ? `<div class="empty-state"><b>No students yet</b>Add students first from the Students tab.</div>` :
    (records.length ? records.map((r,idx)=>{
      const total = r.subjects.reduce((a,b)=>a+Number(b.full||0),0);
      const obtained = r.subjects.reduce((a,b)=>a+Number(b.marks||0),0);
      const pct = total ? (obtained/total*100) : 0;
      return `
      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <span class="tag">${esc(r.term)} — ${esc(r.year)}</span>
            <h3 style="margin:4px 0;">${esc(r.exam)}</h3>
          </div>
          <div class="row-actions">

            <button class="btn danger small" data-del-exam="${idx}">Delete</button>
          </div>
        </div>
        <table class="data-table" style="margin-top:10px;">
          <thead><tr><th>Subject</th><th>Full Marks</th><th>Obtained</th></tr></thead>
          <tbody>${r.subjects.map(sub=>`<tr><td>${esc(sub.name)}</td><td>${esc(sub.full)}</td><td>${esc(sub.marks)}</td></tr>`).join('')}</tbody>
        </table>
        <div style="margin-top:10px;font-weight:700;color:var(--maroon-dark);">Total: ${obtained}/${total} &nbsp; (${pct.toFixed(1)}%) &nbsp; Grade: <span class="badge ${pct>=40?'ok':'bad'}">${computeGrade(pct)}</span></div>
      </div>`;
    }).join('') : `<div class="empty-state"><b>No exam results yet</b>Add the first exam result for ${esc(student.name)}.</div>`)}

/* ================= ADMIN EVENTS ================= */
function attachAdminEvents(){
  document.querySelectorAll('.admin-nav button').forEach(b=>b.addEventListener('click',()=>{ ADMIN_TAB=b.dataset.tab; editingId=null; render(); }));
  document.getElementById('logoutBtn').addEventListener('click', ()=>{ IS_ADMIN=false; VIEW='public'; PUBLIC_PAGE='home'; render(); });
  document.getElementById('viewSiteBtn').addEventListener('click', ()=>{ VIEW='public'; PUBLIC_PAGE='home'; render(); });

  if(ADMIN_TAB==='students') attachStudentsEvents();
  if(ADMIN_TAB==='teachers') attachTeachersEvents();
  if(ADMIN_TAB==='attendance') attachAttendanceEvents();
  if(ADMIN_TAB==='grades') attachGradesEvents();
  if(ADMIN_TAB==='fees') attachFeesEvents();
  if(ADMIN_TAB==='notices') attachNoticesEvents();
  if(ADMIN_TAB==='events') attachEventsEvents();
  if(ADMIN_TAB==='gallery') attachGalleryEvents();
  if(ADMIN_TAB==='settings') attachSettingsEvents();

  if(activeModal){
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
  }
}

function attachStudentsEvents(){
  document.getElementById('clsFilter').addEventListener('change', e=>{ studentFilter.cls = e.target.value; render(); });
  document.getElementById('qFilter').addEventListener('input', e=>{ studentFilter.q = e.target.value; render(); });
  document.getElementById('addStudentBtn').addEventListener('click', ()=>{
    editingId=null;
    openModal('Add Student', studentForm(), true);
    document.getElementById('modalForm').addEventListener('submit', submitStudentForm);
  });
  document.querySelectorAll('[data-edit-student]').forEach(b=>b.addEventListener('click', ()=>{
    const s = DATA.students.find(x=>x.id===b.dataset.editStudent);
    editingId = s.id;
    openModal('Edit Student', studentForm(s));
    document.getElementById('modalForm').addEventListener('submit', submitStudentForm);
  }));
  document.querySelectorAll('[data-del-student]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Delete this student and all their records?')) return;
    const id = b.dataset.delStudent;
    DATA.students = DATA.students.filter(s=>s.id!==id);
    delete DATA.grades[id]; delete DATA.fees[id];
    Object.keys(DATA.attendance).forEach(d=>delete DATA.attendance[d][id]);
    saveData(); render();
  }));
}
function submitStudentForm(e){
  e.preventDefault();
  const id = document.getElementById('f_id').value || uid('stu');
  const rec = {
    id, name: document.getElementById('f_name').value.trim(),
    gender: document.getElementById('f_gender').value,
    cls: document.getElementById('f_cls').value,
    section: document.getElementById('f_section').value.trim(),
    roll: document.getElementById('f_roll').value,
    dob: document.getElementById('f_dob').value,
    guardian: document.getElementById('f_guardian').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    address: document.getElementById('f_address').value.trim(),
  };
  if(!rec.name){ alert('Please enter the student name.'); return; }
  const idx = DATA.students.findIndex(s=>s.id===id);
  if(idx>=0) DATA.students[idx] = rec; else DATA.students.push(rec);
  saveData(); closeModal();
}

function attachTeachersEvents(){
  document.getElementById('addTeacherBtn').addEventListener('click', ()=>{
    editingId=null;
    openModal('Add Teacher', teacherForm());
    document.getElementById('modalForm').addEventListener('submit', submitTeacherForm);
  });
  document.querySelectorAll('[data-edit-teacher]').forEach(b=>b.addEventListener('click', ()=>{
    const t = DATA.teachers.find(x=>x.id===b.dataset.editTeacher);
    editingId = t.id;
    openModal('Edit Teacher', teacherForm(t));
    document.getElementById('modalForm').addEventListener('submit', submitTeacherForm);
  }));
  document.querySelectorAll('[data-del-teacher]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Delete this teacher profile?')) return;
    DATA.teachers = DATA.teachers.filter(t=>t.id!==b.dataset.delTeacher);
    saveData(); render();
  }));
}
function submitTeacherForm(e){
  e.preventDefault();
  const id = document.getElementById('t_id').value || uid('tea');
  const rec = {
    id, name: document.getElementById('t_name').value.trim(),
    designation: document.getElementById('t_designation').value,
    subject: document.getElementById('t_subject').value.trim(),
    qualification: document.getElementById('t_qualification').value.trim(),
    phone: document.getElementById('t_phone').value.trim(),
    email: document.getElementById('t_email').value.trim(),
    joined: document.getElementById('t_joined').value,
    photo: document.getElementById('t_photo').value.trim(),
  };
  if(!rec.name){ alert('Please enter the teacher name.'); return; }
  const idx = DATA.teachers.findIndex(t=>t.id===id);
  if(idx>=0) DATA.teachers[idx] = rec; else DATA.teachers.push(rec);
  saveData(); closeModal();
}

function attachAttendanceEvents(){
  document.getElementById('attClassSel').addEventListener('change', e=>{ attClass=e.target.value; render(); });
  document.getElementById('attDateSel').addEventListener('change', e=>{ attDate=e.target.value; render(); });
  document.querySelectorAll('.att-row').forEach(row=>{
    row.querySelectorAll('.att-options button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const sid = row.dataset.student;
        if(!DATA.attendance[attDate]) DATA.attendance[attDate] = {};
        DATA.attendance[attDate][sid] = btn.dataset.status;
        render();
      });
    });
  });
  document.getElementById('saveAttendanceBtn').addEventListener('click', ()=>{ saveData(); });
}

function attachGradesEvents(){
  const sel = document.getElementById('gradeStudentSel');
  if(sel) sel.addEventListener('change', e=>{ editingId = e.target.value; render(); });
  const addBtn = document.getElementById('addExamBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    const sid = sel.value;
    openModal('Add Exam Result', examForm());
    let subjIdx = 3;
    document.getElementById('addSubjectRow').addEventListener('click', ()=>{
      subjIdx++;
      document.getElementById('subjectsWrap').insertAdjacentHTML('beforeend', subjectRow(subjIdx));
    });
    document.getElementById('modalForm').addEventListener('submit', ev=>{
      ev.preventDefault();
      const exam = document.getElementById('ex_name').value.trim();
      const term = document.getElementById('ex_term').value.trim();
      const year = document.getElementById('ex_year').value.trim();
      if(!exam){ alert('Please enter exam name.'); return; }
      const subjects = [];
      document.querySelectorAll('.subject-row').forEach(row=>{
        const name = row.querySelector('.sub-name').value.trim();
        const full = row.querySelector('.sub-full').value;
        const marks = row.querySelector('.sub-marks').value;
        if(name) subjects.push({name, full: full||0, marks: marks||0});
      });
      if(!subjects.length){ alert('Please add at least one subject.'); return; }
      if(!DATA.grades[sid]) DATA.grades[sid] = [];
      DATA.grades[sid].push({exam, term, year, subjects});
      saveData(); closeModal();
    });
  });
  document.querySelectorAll('[data-del-exam]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Delete this exam result?')) return;
    const sid = editingId || sel.value;
    DATA.grades[sid].splice(Number(b.dataset.delExam),1);
    saveData(); render();
  }));
  document.querySelectorAll('[data-print-report]').forEach(b=>b.addEventListener('click', ()=>{
    const sid = editingId || sel.value;
    printReportCard(sid, Number(b.dataset.printReport));
  }));
}
function subjectRow(i){
  return `<div class="field-row cols-3 subject-row" style="align-items:end;">
    <div class="field"><label>Subject ${i}</label><input type="text" class="sub-name" placeholder="e.g. Mathematics"></div>
    <div class="field"><label>Full Marks</label><input type="number" class="sub-full" value="100"></div>
    <div class="field"><label>Obtained</label><input type="number" class="sub-marks"></div>
  </div>`;
}
function examForm(){
  return `
  <div class="field-row cols-3">
    <div class="field"><label>Exam Name</label><input type="text" id="ex_name" placeholder="First Terminal"></div>
    <div class="field"><label>Term</label><input type="text" id="ex_term" placeholder="First Term"></div>
    <div class="field"><label>Year</label><input type="text" id="ex_year" placeholder="2082 B.S." value="2082 B.S."></div>
  </div>
  <div id="subjectsWrap">
    ${[1,2,3].map(i=>subjectRow(i)).join('')}
  </div>
  <button type="button" class="btn ghost small" id="addSubjectRow" style="margin-top:6px;">+ Add Subject</button>
  `;
}
function printReportCard(studentId, idx){
  const student = DATA.students.find(s=>s.id===studentId);
  const r = DATA.grades[studentId][idx];
  const total = r.subjects.reduce((a,b)=>a+Number(b.full||0),0);
  const obtained = r.subjects.reduce((a,b)=>a+Number(b.marks||0),0);
  const pct = total ? (obtained/total*100) : 0;
  const sheet = document.getElementById('printSheet');
  sheet.innerHTML = `
    <div style="font-family:'Mukta',sans-serif;max-width:700px;margin:0 auto;border:2px solid #7A1F3D;padding:30px;">
      <h2 style="text-align:center;color:#54142B;margin:0;">${esc(DATA.settings.nameEn)}</h2>
      <p style="text-align:center;margin:2px 0 20px;">${esc(DATA.settings.address)}</p>
      <h3 style="text-align:center;text-decoration:underline;">Progress Report — ${esc(r.exam)} (${esc(r.term)}, ${esc(r.year)})</h3>
      <p><b>Name:</b> ${esc(student.name)} &nbsp; <b>Class:</b> ${esc(student.cls)}${student.section?('-'+esc(student.section)):''} &nbsp; <b>Roll No:</b> ${esc(student.roll)}</p>
      <table style="width:100%;border-collapse:collapse;margin-top:14px;">
        <thead><tr><th style="border:1px solid #999;padding:6px;">Subject</th><th style="border:1px solid #999;padding:6px;">Full Marks</th><th style="border:1px solid #999;padding:6px;">Obtained</th></tr></thead>
        <tbody>${r.subjects.map(s=>`<tr><td style="border:1px solid #999;padding:6px;">${esc(s.name)}</td><td style="border:1px solid #999;padding:6px;text-align:center;">${esc(s.full)}</td><td style="border:1px solid #999;padding:6px;text-align:center;">${esc(s.marks)}</td></tr>`).join('')}</tbody>
      </table>
      <p style="margin-top:16px;font-size:16px;"><b>Total:</b> ${obtained} / ${total} &nbsp; <b>Percentage:</b> ${pct.toFixed(1)}% &nbsp; <b>Grade:</b> ${computeGrade(pct)}</p>
      <div style="display:flex;justify-content:space-between;margin-top:60px;">
        <div>_______________________<br>Class Teacher</div>
        <div>_______________________<br>Principal</div>
      </div>
    </div>`;
  window.print();
}

function attachFeesEvents(){
  const sel = document.getElementById('feeStudentSel');
  if(sel) sel.addEventListener('change', e=>{ editingId = e.target.value; render(); });
  const addBtn = document.getElementById('addFeeBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    const sid = sel.value;
    openModal('Add Fee Record', `
      <div class="field-row cols-3">
        <div class="field"><label>Term</label><input type="text" id="fe_term" placeholder="First Term" required></div>
        <div class="field"><label>Year</label><input type="text" id="fe_year" placeholder="2082 B.S." required></div>
        <div class="field"><label>Due Date</label><input type="date" id="fe_due"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Total Amount (Rs.)</label><input type="number" id="fe_amount" required></div>
        <div class="field"><label>Amount Paid (Rs.)</label><input type="number" id="fe_paid" value="0"></div>
      </div>
    `);
    document.getElementById('modalForm').addEventListener('submit', ev=>{
      ev.preventDefault();
      const rec = { term:document.getElementById('fe_term').value.trim(), year:document.getElementById('fe_year').value.trim(),
        due:document.getElementById('fe_due').value, amount:document.getElementById('fe_amount').value, paid:document.getElementById('fe_paid').value };
      if(!rec.term || !rec.amount){ alert('Please fill in term and amount.'); return; }
      if(!DATA.fees[sid]) DATA.fees[sid] = [];
      DATA.fees[sid].push(rec);
      saveData(); closeModal();
    });
  });
  document.querySelectorAll('[data-del-fee]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Delete this fee record?')) return;
    const sid = editingId || sel.value;
    DATA.fees[sid].splice(Number(b.dataset.delFee),1);
    saveData(); render();
  }));
}

function attachNoticesEvents(){
  document.getElementById('addNoticeBtn').addEventListener('click', ()=>{
    editingId=null;
    openModal('Add Notice', noticeForm());
    bindNoticeSubmit();
  });
  document.querySelectorAll('[data-edit-notice]').forEach(b=>b.addEventListener('click', ()=>{
    const n = DATA.notices.find(x=>x.id===b.dataset.editNotice);
    editingId = n.id;
    openModal('Edit Notice', noticeForm(n));
    bindNoticeSubmit();
  }));
  document.querySelectorAll('[data-del-notice]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Delete this notice?')) return;
    DATA.notices = DATA.notices.filter(n=>n.id!==b.dataset.delNotice);
    saveData(); render();
  }));
}
function noticeForm(n){
  n = n || {title:'',date:new Date().toISOString().slice(0,10),content:''};
  return `
    <div class="field"><label>Title</label><input type="text" id="no_title" value="${esc(n.title)}" required></div>
    <div class="field"><label>Date</label><input type="date" id="no_date" value="${esc(n.date)}" required></div>
    <div class="field"><label>Content</label><textarea id="no_content" required>${esc(n.content)}</textarea></div>
  `;
}
function bindNoticeSubmit(){
  document.getElementById('modalForm').addEventListener('submit', e=>{
    e.preventDefault();
    const rec = { id: editingId || uid('n'), title: document.getElementById('no_title').value.trim(), date: document.getElementById('no_date').value, content: document.getElementById('no_content').value.trim() };
    if(!rec.title){ alert('Please enter a title.'); return; }
    const idx = DATA.notices.findIndex(x=>x.id===rec.id);
    if(idx>=0) DATA.notices[idx]=rec; else DATA.notices.push(rec);
    saveData(); closeModal();
  });
}

function attachGalleryEvents(){
  document.getElementById('addGalleryBtn').addEventListener('click', ()=>{
    openModal('Add Photo', `
      <div class="field"><label>Image URL</label><input type="text" id="ga_url" placeholder="https://..." required></div>
      <div class="field"><label>Caption</label><input type="text" id="ga_caption" placeholder="Sports Day 2026" required></div>
    `);
    document.getElementById('modalForm').addEventListener('submit', e=>{
      e.preventDefault();
      const url = document.getElementById('ga_url').value.trim();
      const caption = document.getElementById('ga_caption').value.trim();
      if(!url){ alert('Please enter an image URL.'); return; }
      DATA.gallery.push({id:uid('g'), url, caption});
      saveData(); closeModal();
    });
  });
  document.querySelectorAll('[data-del-gallery]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Delete this photo?')) return;
    DATA.gallery = DATA.gallery.filter(g=>g.id!==b.dataset.delGallery);
    saveData(); render();
  }));
}

function attachSettingsEvents(){
  document.getElementById('settingsForm').addEventListener('submit', e=>{
    e.preventDefault();
    DATA.settings.nameEn = document.getElementById('s_nameEn').value.trim();
    DATA.settings.nameNp = document.getElementById('s_nameNp').value.trim();
    DATA.settings.address = document.getElementById('s_address').value.trim();
    DATA.settings.phone = document.getElementById('s_phone').value.trim();
    DATA.settings.email = document.getElementById('s_email').value.trim();
    DATA.settings.established = document.getElementById('s_established').value.trim();
    DATA.settings.principal = document.getElementById('s_principal').value.trim();
    DATA.settings.motto = document.getElementById('s_motto').value.trim();
    saveData(); render();
  });
  document.getElementById('passwordForm').addEventListener('submit', e=>{
    e.preventDefault();
    const val = document.getElementById('s_newpass').value;
    if(!val){ return; }
    DATA.settings.adminPassword = val;
    saveData();
    document.getElementById('s_newpass').value='';
    showToast('Password updated');
  });
}

boot();
